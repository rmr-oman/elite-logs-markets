<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <title>Elite Logs Market | Premium Digital Assets</title>
    <script>
      // Enforce session expiration on browser close:
      // If sessionStorage key 'elite_active_browser_session' is absent on initial load,
      // purge any legacy cached user profile from localStorage so user starts unauthenticated.
      if (!sessionStorage.getItem('elite_active_browser_session')) {
        localStorage.removeItem('elite_logs_user');
      }
      window.addEventListener('unhandledrejection', function(event) {
        var str = String(event.reason || '');
        if (str.includes('WebSocket') || (event.reason && event.reason.message && event.reason.message.includes('WebSocket'))) {
          event.preventDefault();
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
