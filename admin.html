<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <title>Elite Logs | Master Admin Panel</title>
    <script>
      window.addEventListener('unhandledrejection', function(event) {
        var str = String(event.reason || '');
        if (str.includes('WebSocket') || (event.reason && event.reason.message && event.reason.message.includes('WebSocket'))) {
          event.preventDefault();
        }
      });
    </script>
  </head>
  <body class="bg-[#0B0B0F] text-white font-sans selection:bg-neon-purple selection:text-black">
    <div id="admin-root"></div>
    <script type="module" src="/src/adminMain.tsx"></script>
  </body>
</html>
